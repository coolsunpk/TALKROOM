<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>TalkRoom — Rooms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #080b12;
    --panel: #0f141e;
    --panel2: #141a26;
    --border: #252d3b;
    --text: #f4f6fb;
    --muted: #8992a4;
    --accent: #6c63ff;
    --green: #35d982;
    --red: #ff6675;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(108,99,255,.13),
            transparent 32%
        ),
        var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

/* HEADER */

.header {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: rgba(15,20,30,.94);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.logo span {
    color: var(--accent);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.create-button {
    height: 38px;
    padding: 0 15px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

.create-button:hover {
    opacity: .9;
}

.account {
    display: flex;
    align-items: center;
    gap: 10px;
}

.account-avatar {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    overflow: hidden;
    background: #28235c;
    color: #b8b3ff;
    font-size: 13px;
    font-weight: bold;
}

.account-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.account-name {
    color: #c5cad5;
    font-size: 13px;
}

/* MAIN */

.container {
    width: min(1100px, 92%);
    margin: auto;
    padding: 55px 0 70px;
}

/* HERO */

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    line-height: 1.1;
    margin-bottom: 12px;
}

.hero h1 span {
    color: var(--accent);
}

.hero p {
    max-width: 600px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
}

/* ERROR */

#error {
    display: none;
    margin-bottom: 20px;
    padding: 11px;
    border-radius: 10px;
    background: #351b21;
    color: #ff8a8a;
    text-align: center;
    font-size: 12px;
}

/* SEARCH */

.search-box {
    position: relative;
    margin-bottom: 25px;
}

.search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #687286;
}

#searchInput {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 45px;
    border-radius: 12px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel);
    color: white;
    font-size: 14px;
}

#searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.1);
}

/* SECTION */

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-title h2 {
    font-size: 15px;
}

.room-count {
    color: var(--muted);
    font-size: 11px;
}

/* ROOMS */

.rooms {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );
    gap: 15px;
}

/* CARD */

.room-card {
    position: relative;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    cursor: pointer;
    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}

.room-card:hover {
    transform: translateY(-3px);
    border-color: #45406e;
    background: #121925;
}

.room-icon {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: #24204e;
    font-size: 21px;
    margin-bottom: 16px;
}

.room-card.adult .room-icon {
    background: #43232b;
}

.room-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 7px;
}

.room-description {
    min-height: 38px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

.room-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
}

.room-status {
    color: var(--green);
    font-size: 10px;
    font-weight: bold;
}

.room-card.adult .room-status {
    color: var(--red);
}

.join {
    color: #aaa5ff;
    font-size: 11px;
    font-weight: bold;
}

.owner-label {
    margin-top: 8px;
    color: #777f91;
    font-size: 9px;
}

.delete-room {
    position: absolute;
    top: 12px;
    right: 12px;
    border: 1px solid #492d34;
    background: #24171c;
    color: #ff7d89;
    border-radius: 6px;
    padding: 5px 7px;
    font-size: 8px;
    cursor: pointer;
}

.delete-room:hover {
    background: #3a1d25;
}

/* 18+ */

.age-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 4px 7px;
    border-radius: 6px;
    background: #4a2028;
    color: #ff8b96;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .5px;
}

/* EMPTY */

.empty {
    display: none;
    padding: 40px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 14px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.72);
    z-index: 1000;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(430px, 100%);
    padding: 25px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

.modal-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.modal-subtitle {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.form-label {
    display: block;
    margin-bottom: 7px;
    color: #b8becb;
    font-size: 10px;
    font-weight: bold;
}

#roomNameInput {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    background: #0b1018;
    color: white;
    font-size: 13px;
}

#roomNameInput:focus {
    border-color: var(--accent);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.modal-button {
    height: 38px;
    padding: 0 15px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
}

.cancel-button {
    border: 1px solid var(--border);
    background: #151b26;
    color: #9ba3b3;
}

.confirm-button {
    border: none;
    background: var(--accent);
    color: white;
}

.confirm-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* FOOTER */

.footer {
    margin-top: 55px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: #596375;
    font-size: 11px;
    text-align: center;
}

/* MOBILE */

@media(max-width:600px) {

    .header {
        padding: 0 16px;
    }

    .header-right {
        gap: 8px;
    }

    .create-button {
        padding: 0 10px;
        font-size: 10px;
    }

    .account-name {
        display: none;
    }

    .container {
        padding-top: 35px;
    }

    .rooms {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header class="header">


<div class="logo">
    Talk<span>Room</span>
</div>

<div class="header-right">

    <button
        class="create-button"
        onclick="openCreateRoom()"
    >
        + Create Room
    </button>

    <div class="account">

        <div
            class="account-avatar"
            id="accountAvatar"
        >
            ?
        </div>

        <div
            class="account-name"
            id="accountName"
        >
            Loading...
        </div>

    </div>

</div>


</header>

<main class="container">

<section class="hero">


<h1>
    Find your
    <span>room.</span>
</h1>

<p>
    Choose a room, join the conversation,
    and meet people in real time.
</p>


</section>

<div id="error"></div>

<div class="search-box">


<div class="search-icon">
    🔍
</div>

<input
    id="searchInput"
    type="text"
    placeholder="Search rooms..."
    autocomplete="off"
>


</div>

<div class="section-title">


<h2>
    ROOMS
</h2>

<div
    class="room-count"
    id="roomCount"
>
    Loading...
</div>


</div>

<div
    class="rooms"
    id="rooms"
></div>

<div
    class="empty"
    id="empty"
>
    No rooms found.
</div>

<footer class="footer">
    TalkRoom — Meet. Talk. Connect.
</footer>

</main>

<!-- CREATE ROOM MODAL -->

<div
    class="modal"
    id="createModal"
>


<div class="modal-box">

    <div class="modal-title">
        Create a room
    </div>

    <div class="modal-subtitle">
        Create your own public TalkRoom room.
        Your room will appear immediately.
    </div>

    <label
        class="form-label"
        for="roomNameInput"
    >
        ROOM NAME
    </label>

    <input
        id="roomNameInput"
        type="text"
        maxlength="40"
        placeholder="e.g. Pakistani Friends"
        autocomplete="off"
    >

    <div class="modal-actions">

        <button
            class="modal-button cancel-button"
            onclick="closeCreateRoom()"
        >
            Cancel
        </button>

        <button
            class="modal-button confirm-button"
            id="createRoomButton"
            onclick="createRoom()"
        >
            Create Room
        </button>

    </div>

</div>


</div>

<script>

/* ============================================================
   GLOBALS
============================================================ */

let currentUser = null;

let currentProfile = null;

let databaseRooms = [];

let roomChannels = [];


/* ============================================================
   DEFAULT ROOMS
============================================================ */

const defaultRooms = [

    {
        room_name: "General",
        description:
            "Talk about anything and meet new people.",
        icon: "💬",
        search:
            "general chat talking social"
    },

    {
        room_name: "Gaming",
        description:
            "Games, players and gaming conversations.",
        icon: "🎮",
        search:
            "gaming games gamers play"
    },

    {
        room_name: "Study",
        description:
            "Study together and share ideas.",
        icon: "📚",
        search:
            "study education students school"
    },

    {
        room_name: "Music",
        description:
            "Share music and talk about your favorites.",
        icon: "🎵",
        search:
            "music songs artists"
    },

    {
        room_name: "Movies",
        description:
            "Discuss movies, shows and entertainment.",
        icon: "🎬",
        search:
            "movies films cinema tv"
    },

    {
        room_name: "Sports",
        description:
            "Football, cricket, basketball and more.",
        icon: "⚽",
        search:
            "sports football cricket basketball"
    },

    {
        room_name: "18+",
        description:
            "Age-restricted social chat for adults.",
        icon: "🔞",
        search:
            "18 adult mature age restricted",
        adult: true
    }

];


/* ============================================================
   ELEMENTS
============================================================ */

const roomsElement =
    document.getElementById("rooms");

const emptyElement =
    document.getElementById("empty");

const roomCountElement =
    document.getElementById("roomCount");

const searchInput =
    document.getElementById("searchInput");

const createModal =
    document.getElementById("createModal");

const roomNameInput =
    document.getElementById("roomNameInput");

const createRoomButton =
    document.getElementById("createRoomButton");


/* ============================================================
   ERROR
============================================================ */

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        message;

    error.style.display =
        "block";

}

function hideError() {

    const error =
        document.getElementById("error");

    error.style.display =
        "none";

}


/* ============================================================
   LOAD USER
============================================================ */

async function loadUser() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !data.user
    ) {

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.user;


    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,username,avatar_url,is_premium,premium_until,is_admin,is_moderator,role"
            )
            .eq(
                "id",
                currentUser.id
            )
            .single();


    if (
        profileError ||
        !profile
    ) {

        console.error(
            profileError
        );

        showError(
            "Could not load your profile."
        );

        return false;

    }


    currentProfile =
        profile;


    const name =
        profile.username ||
        "User";


    document
        .getElementById("accountName")
        .textContent =
        name;


    const avatarElement =
        document.getElementById(
            "accountAvatar"
        );


    if (
        profile.is_premium === true &&
        profile.avatar_url &&
        (
            !profile.premium_until ||
            new Date(profile.premium_until) >
            new Date()
        )
    ) {

        const img =
            document.createElement("img");

        img.src =
            profile.avatar_url;

        img.alt =
            name;

        img.onerror =
            function() {

                img.remove();

                avatarElement.textContent =
                    name
                        .charAt(0)
                        .toUpperCase();

            };

        avatarElement.innerHTML = "";

        avatarElement.appendChild(img);

    } else {

        avatarElement.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }


    return true;

}


/* ============================================================
   LOAD ROOMS FROM DATABASE
============================================================ */

async function loadDatabaseRooms() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("rooms")
            .select(
                "id,room_name,owner_id"
            )
            .order(
                "room_name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Room loading error:",
            error
        );

        showError(
            "Could not load rooms: " +
            error.message
        );

        databaseRooms = [];

        return;

    }


    databaseRooms =
        data || [];

}


/* ============================================================
   BUILD ROOM LIST
============================================================ */

function getAllRooms() {

    const combined = [];

    const names = new Set();


    defaultRooms.forEach(
        function(room) {

            const key =
                room.room_name
                    .toLowerCase();

            if (!names.has(key)) {

                names.add(key);

                combined.push({
                    ...room,
                    databaseRoom: false,
                    owner_id: null,
                    id: null
                });

            }

        }
    );


    databaseRooms.forEach(
        function(room) {

            const key =
                room.room_name
                    .toLowerCase();

            if (!names.has(key)) {

                names.add(key);

                combined.push({

                    room_name:
                        room.room_name,

                    description:
                        "A community room created by a TalkRoom user.",

                    icon:
                        "💬",

                    search:
                        (
                            room.room_name +
                            " chat community"
                        ).toLowerCase(),

                    adult:
                        false,

                    databaseRoom:
                        true,

                    owner_id:
                        room.owner_id,

                    id:
                        room.id

                });

            }

        }
    );


    return combined;

}


/* ============================================================
   RENDER ROOMS
============================================================ */

function renderRooms() {

    const allRooms =
        getAllRooms();


    const query =
        searchInput.value
            .toLowerCase()
            .trim();


    roomsElement.innerHTML = "";


    let visible =
        0;


    allRooms.forEach(
        function(room) {

            const searchText =
                (
                    room.room_name +
                    " " +
                    room.description +
                    " " +
                    room.search
                )
                .toLowerCase();


            if (
                query &&
                !searchText.includes(query)
            ) {

                return;

            }


            visible++;


            const card =
                document.createElement("div");


            card.className =
                "room-card" +
                (
                    room.adult
                        ? " adult"
                        : ""
                );


            card.dataset.room =
                room.room_name;


            card.onclick =
                function() {

                    if (room.adult) {

                        joinAdultRoom();

                    } else {

                        joinRoom(
                            room.room_name
                        );

                    }

                };


            /* ICON */

            const icon =
                document.createElement("div");

            icon.className =
                "room-icon";

            icon.textContent =
                room.icon;


            /* NAME */

            const name =
                document.createElement("div");

            name.className =
                "room-name";

            name.textContent =
                room.room_name;


            /* DESCRIPTION */

            const description =
                document.createElement("div");

            description.className =
                "room-description";

            description.textContent =
                room.description;


            /* BOTTOM */

            const bottom =
                document.createElement("div");

            bottom.className =
                "room-bottom";


            const status =
                document.createElement("div");

            status.className =
                "room-status";


            status.dataset.roomName =
                room.room_name;


            status.textContent =
                "● 0 online";


            const join =
                document.createElement("div");

            join.className =
                "join";

            join.textContent =
                room.adult
                    ? "Enter →"
                    : "Join →";


            bottom.appendChild(
                status
            );

            bottom.appendChild(
                join
            );


            card.appendChild(
                icon
            );

            card.appendChild(
                name
            );

            card.appendChild(
                description
            );

            card.appendChild(
                bottom
            );


            /* OWNER */

            if (
                room.databaseRoom &&
                room.owner_id
            ) {

                const owner =
                    document.createElement("div");

                owner.className =
                    "owner-label";

                if (
                    room.owner_id ===
                    currentUser.id
                ) {

                    owner.textContent =
                        "Your room";

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "delete-room";

                    deleteButton.textContent =
                        "Delete";

                    deleteButton.onclick =
                        function(event) {

                            event.stopPropagation();

                            deleteRoom(
                                room
                            );

                        };

                    card.appendChild(
                        deleteButton
                    );

                }

                card.appendChild(
                    owner
                );

            }


            /* 18+ */

            if (room.adult) {

                const ageBadge =
                    document.createElement("div");

                ageBadge.className =
                    "age-badge";

                ageBadge.textContent =
                    "18+";

                card.appendChild(
                    ageBadge
                );

            }


            roomsElement.appendChild(
                card
            );

        }
    );


    roomCountElement.textContent =
        visible +
        (
            visible === 1
                ? " room"
                : " rooms"
        );


    emptyElement.style.display =
        visible === 0
            ? "block"
            : "none";


    startRoomPresence();

}


/* ============================================================
   CREATE ROOM MODAL
============================================================ */

function openCreateRoom() {

    hideError();

    roomNameInput.value =
        "";

    createModal.classList.add(
        "show"
    );

    setTimeout(
        function() {

            roomNameInput.focus();

        },
        100
    );

}


function closeCreateRoom() {

    createModal.classList.remove(
        "show"
    );

}


createModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            createModal
        ) {

            closeCreateRoom();

        }

    }
);


/* ============================================================
   CREATE ROOM
============================================================ */

async function createRoom() {

    if (!currentUser) {

        showError(
            "You must be logged in."
        );

        return;

    }


    let name =
        roomNameInput.value
            .trim();


    if (!name) {

        alert(
            "Enter a room name."
        );

        roomNameInput.focus();

        return;

    }


    if (name.length < 2) {

        alert(
            "Room name must contain at least 2 characters."
        );

        return;

    }


    if (name.length > 40) {

        alert(
            "Room name is too long."
        );

        return;

    }


    /* CLEAN NAME */

    name =
        name.replace(
            /\s+/g,
            " "
        );


    /* RESERVED 18+ */

    if (
        name.toLowerCase() ===
        "18+"
    ) {

        alert(
            "This room name is reserved."
        );

        return;

    }


    /* CHECK DUPLICATE */

    const existing =
        getAllRooms()
            .find(
                function(room) {

                    return (
                        room.room_name
                            .toLowerCase() ===
                        name.toLowerCase()
                    );

                }
            );


    if (existing) {

        alert(
            "A room with this name already exists."
        );

        return;

    }


    createRoomButton.disabled =
        true;

    createRoomButton.textContent =
        "Creating...";


    hideError();


    const {
        data,
        error
    } =
        await supabaseClient
            .from("rooms")
            .insert(
                {
                    room_name:
                        name,

                    owner_id:
                        currentUser.id
                }
            )
            .select(
                "id,room_name,owner_id"
            )
            .single();


    createRoomButton.disabled =
        false;

    createRoomButton.textContent =
        "Create Room";


    if (error) {

        console.error(
            "Create room error:",
            error
        );


        if (
            error.code ===
            "23505"
        ) {

            alert(
                "A room with this name already exists."
            );

        } else {

            showError(
                "Could not create room: " +
                error.message
            );

        }

        return;

    }


    if (data) {

        databaseRooms.push(
            data
        );

    }


    closeCreateRoom();

    renderRooms();


    /* OPEN NEW ROOM */

    setTimeout(
        function() {

            joinRoom(
                name
            );

        },
        250
    );

}


/* ============================================================
   JOIN ROOM
============================================================ */

function joinRoom(roomName) {

    localStorage.setItem(
        "talkroom_current_room",
        roomName
    );

    window.location.href =
        "chat.html";

}


/* ============================================================
   18+ ROOM
============================================================ */

function joinAdultRoom() {

    const confirmed =
        confirm(
            "This room is restricted to users aged 18 or older. Continue?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.setItem(
        "talkroom_current_room",
        "18+"
    );


    window.location.href =
        "chat.html";

}


/* ============================================================
   DELETE ROOM
============================================================ */

async function deleteRoom(room) {

    if (
        !room ||
        !room.id
    ) {

        return;

    }


    if (
        room.owner_id !==
        currentUser.id
    ) {

        alert(
            "Only the room owner can delete this room."
        );

        return;

    }


    const confirmed =
        confirm(
            'Delete "' +
            room.room_name +
            '"?\n\nThis cannot be undone.'
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("rooms")
            .delete()
            .eq(
                "id",
                room.id
            )
            .eq(
                "owner_id",
                currentUser.id
            );


    if (error) {

        console.error(
            "Delete room error:",
            error
        );

        showError(
            "Could not delete room: " +
            error.message
        );

        return;

    }


    databaseRooms =
        databaseRooms.filter(
            function(item) {

                return (
                    item.id !==
                    room.id
                );

            }
        );


    renderRooms();

}


/* ============================================================
   SEARCH
============================================================ */

searchInput.addEventListener(
    "input",
    function() {

        renderRooms();

    }
);


/* ============================================================
   ROOM PRESENCE
============================================================ */

function startRoomPresence() {

    roomChannels.forEach(
        function(channel) {

            supabaseClient
                .removeChannel(
                    channel
                );

        }
    );


    roomChannels =
        [];


    const allRooms =
        getAllRooms();


    allRooms.forEach(
        function(room) {

            const counter =
                document.querySelector(
                    '[data-room-name="' +
                    CSS.escape(
                        room.room_name
                    ) +
                    '"]'
                );


            if (!counter) {
                return;
            }


            const channel =
                supabaseClient.channel(
                    "talkroom-" +
                    room.room_name
                );


            roomChannels.push(
                channel
            );


            channel
                .on(
                    "presence",
                    {
                        event: "sync"
                    },
                    function() {

                        updateRoomCount(
                            channel,
                            counter
                        );

                    }
                )
                .subscribe();

        }
    );

}


function updateRoomCount(
    channel,
    counter
) {

    if (!counter) {
        return;
    }


    const state =
        channel.presenceState();


    const users = {};


    Object
        .values(state)
        .flat()
        .forEach(
            function(user) {

                if (
                    user.user_id
                ) {

                    users[
                        user.user_id
                    ] =
                        user;

                }

            }
        );


    const count =
        Object.keys(users)
            .length;


    counter.textContent =
        "● " +
        count +
        " online";

}


/* ============================================================
   REALTIME ROOM CREATION
============================================================ */

let roomsRealtimeChannel =
    null;


function setupRoomRealtime() {

    roomsRealtimeChannel =
        supabaseClient
            .channel(
                "rooms-list-" +
                currentUser.id
            );


    roomsRealtimeChannel
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "rooms"
            },
            async function() {

                await loadDatabaseRooms();

                renderRooms();

            }
        )
        .subscribe();

}


/* ============================================================
   ENTER KEY
============================================================ */

roomNameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            createRoom();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeCreateRoom();

        }

    }
);


/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
    "beforeunload",
    function() {

        roomChannels.forEach(
            function(channel) {

                supabaseClient
                    .removeChannel(
                        channel
                    );

            }
        );


        if (roomsRealtimeChannel) {

            supabaseClient
                .removeChannel(
                    roomsRealtimeChannel
                );

        }

    }
);


/* ============================================================
   START
============================================================ */

async function start() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {
        return;
    }


    await loadDatabaseRooms();


    renderRooms();


    setupRoomRealtime();

}


start();

</script>
